# CrackCatch - full stack in one command:
#     docker compose up --build
#
#   dashboard : http://localhost:5173
#   API docs  : http://localhost:8000/docs
#   MongoDB   : localhost:27017
#
# Trained weights, storage and sample media are bind-mounted, so retraining a
# model or dropping in a new video needs no image rebuild.

services:
  mongo:
    image: mongo:7
    container_name: crackcatch-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # The backend must not start querying before Mongo accepts connections.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: crackcatch-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: crackcatch
      STORAGE_DIR: /app/storage
      MODEL_WEIGHTS: /app/model/weights/crackcatch.pt
      CONFIDENCE_THRESHOLD: "0.25"
      INFERENCE_DEVICE: cpu          # containers have no GPU passthrough here
      ALLOW_MEMORY_DB_FALLBACK: "false"   # in Docker, Mongo must really be up
      AUTH_ENABLED: "false"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:4173,http://localhost"
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./model/weights:/app/model/weights
      - ./data/samples:/app/data/samples:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: crackcatch-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mongo_data:
